<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <title>My study dashboard</title>
        <link rel="stylesheet" href="style.css"/>
    </head>

    <body>
        <header class="hero">
            <h1>Med×IT Lab</h1>
            <p>医学×IT×学習効率化</p>
        </header>

        <div class="container">

        <section class="card">
            <h2>目標</h2>
            <p>QB3週</p>
        </section>

        <section class="card">
            <h2>今日のやること</h2>
            <input type="text" id="input-to-do">
            <button id="save-to-do">保存</button>
            <p id="today-to-do"></p>
        </section>


        <section class="card">
            <h2>今日やったこと</h2>
            <input type="text" id="work-input">
            <button id="save-work">保存</button>
            <p id="today-work"></p>
        </section>

        <div class="row">

        <section class="card">
            <h2>学習時間</h2>
            <input type="number" id="time-input">
            <button id="save-time">保存</button>
            <p id="study-time">0h</p>
        </section>

        <section class="card">
            <h2>今日の達成率</h2>

            <div class="progress-bar">
                <div class="progress today-progress"></div>
            </div>
            <p class="big-number">80%</p>
        </section>
        </div>
        <section class="card">
            <h2>全体の進捗</h2>
            <p>QB1週目　30％</p>
            <div class="progress-bar">
                <div class="progress total-progress"></div>
            </div>
        </section>

        </div>

        <a class="button" href="index.html">
            トップページへ
        </a>

        <footer>
            <p>© 2026 Med×IT Lab</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
